name: 发布 SEA 单文件可执行应用

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签名 (例如 v1.0.0，留空则自动根据 package.json 版本生成)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-sea:
    name: 构建与发布 SEA (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装项目依赖
        run: npm install

      - name: 构建并归档 SEA 单文件应用
        run: node scripts/release-sea.js --archive

      - name: 计算 Release 标签 (Windows)
        if: runner.os == 'Windows'
        id: get_tag_win
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag_name }}" -ne "") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $ver = (Get-Content package.json | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          Write-Host "Release Tag: $tag"
          "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: 计算 Release 标签 (macOS)
        if: runner.os != 'Windows'
        id: get_tag_unix
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            tag="${{ inputs.tag_name }}"
          else
            ver=$(node -p "require('./package.json').version")
            tag="v$ver"
          fi
          echo "Release Tag: $tag"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: 发布产物到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag_win.outputs.tag_name || steps.get_tag_unix.outputs.tag_name }}
          generate_release_notes: true
          files: |
            release/sea/*.zip
            release/sea/*.tar.gz
