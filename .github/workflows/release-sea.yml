name: 发布 SEA 单文件可执行应用

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签名 (例如 v1.0.0，留空则自动根据 package.json 版本生成)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-sea:
    name: 构建 SEA (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装项目依赖
        run: npm install

      - name: 构建并归档 SEA 单文件应用
        run: node scripts/release-sea.js --archive

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sea-artifacts-${{ matrix.platform }}
          path: |
            release/sea/*.zip
            release/sea/*.tar.gz

  publish-release:
    name: 发布到 GitHub Release
    needs: build-sea
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: sea-artifacts-*
          merge-multiple: true

      - name: 计算 Release 标签
        id: get_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            tag="${{ inputs.tag_name }}"
          else
            ver=$(node -p "require('./package.json').version")
            tag="v$ver"
          fi
          echo "Release Tag: $tag"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: 发布产物到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          generate_release_notes: true
          files: release-assets/*
